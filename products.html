<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop | Caspian & Sun Food Trading LLC</title>
  <link rel="icon" type="image/png" href="images/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Alex+Brush&display=swap" rel="stylesheet">
<style>
:root{--deep-teal:#1E4951;--rich-gold:#D7BB51;--antique-gold:#AA8D3F;--charcoal:#171813;--cream:#F7F3EC;}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Manrope',sans-serif;color:var(--charcoal);background:#fff;line-height:1.5;}
img{max-width:100%;display:block;}







/* SCROLL-REVEAL ENTRANCE ANIMATIONS */
.reveal{opacity:0;transform:translateY(32px);transition:opacity .9s cubic-bezier(.16,1,.3,1),transform .9s cubic-bezier(.16,1,.3,1);}
.reveal.in-view{opacity:1;transform:translateY(0);}
@media (prefers-reduced-motion: reduce){.reveal{opacity:1!important;transform:none!important;transition:none!important;}}

/* HERO — identical to about.html */
.hero{position:relative;height:100vh;height:100dvh;background:radial-gradient(circle, rgba(0,0,0,0) 0%, rgba(0,0,0,0.8) 100%), url('images/pdf_extracted/extracted_3_2208x3936.jpeg') center 25%/cover;display:flex;align-items:flex-end;padding:clamp(1.5rem,4vw,3.5rem) clamp(2.5rem,7vw,5.5rem);color:#fff;justify-content:flex-end;flex-direction:column;}
.hero-inner{max-width:1400px;margin:0 auto;width:100%;text-align:left;padding:0 clamp(1.5rem,5vw,3rem);padding-bottom:clamp(2rem,4vw,3.5rem);}
.hero h1{font-family:'Playfair Display',serif;font-size:clamp(2.4rem,6.5vw,4.2rem);font-weight:500;margin-bottom:.4rem;text-shadow:0 2px 12px rgba(0,0,0,.25);opacity:0;animation:heroFadeUp 1s cubic-bezier(.16,1,.3,1) .2s forwards;}
.hero p{font-size:16px;font-family:'Manrope',sans-serif;font-weight:400;line-height:27px;max-width:480px;color:#fff;opacity:0;animation:heroFadeUp 1s cubic-bezier(.16,1,.3,1) .45s forwards;}
@keyframes heroFadeUp{from{opacity:0;transform:translateY(22px);}to{opacity:1;transform:translateY(0);}}
@media (prefers-reduced-motion: reduce){.hero h1,.hero p{animation:none;opacity:1;}}

/* SHOP LAYOUT */
.shop-wrap{max-width:1500px;margin:0 auto;padding:clamp(2rem,4vh,4rem) clamp(2.5rem,7vw,5.5rem);min-height: 100vh;box-sizing:border-box;}
.search-row{display:flex;justify-content:space-between;align-items:flex-end;gap:1.5rem;flex-wrap:wrap;margin-bottom:clamp(2.5rem,5vw,4rem);}
.search-row h1{font-family:'Playfair Display',serif;font-size:clamp(1.9rem,4.6vw,3rem);font-weight:500;letter-spacing:-.5px;color:var(--charcoal);}
.search-controls{display:flex;gap:.9rem;flex-wrap:wrap;}
.search-box{position:relative;}
.search-box svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:#999;fill:none;}
.search-box input{width:220px;padding:.75rem 1rem .75rem 2.4rem;border:1px solid #ddd;font-family:'Manrope',sans-serif;font-size:.88rem;color:var(--charcoal);background:#fff;transition:border-color .3s ease,box-shadow .3s ease;}
.search-box input:focus{outline:none;border-color:var(--rich-gold);box-shadow:0 0 0 3px rgba(215,187,81,.2);}
.sort-select{padding:.75rem 2.2rem .75rem 1rem;border:1px solid #ddd;font-family:'Manrope',sans-serif;font-size:.88rem;color:var(--charcoal);background:#fff url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23171813" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>') no-repeat right 12px center/14px;appearance:none;cursor:pointer;}

.shop-grid{display:block;}



/* PRODUCT GRID */
.product-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));gap:clamp(1.5rem,3vw,2.5rem);}
.product-card{background:#fff;border:1px solid #eee;padding:clamp(1.8rem,3vw,2.5rem) 1.2rem 1.6rem;display:flex;flex-direction:column;align-items:center;transition:box-shadow .35s ease,transform .35s ease;}
.product-card:hover{box-shadow:0 18px 40px rgba(0,0,0,.08);transform:translateY(-4px);}
.product-icon{width:100%;aspect-ratio:1/1;overflow:hidden;margin-bottom:1.4rem;}
.product-icon img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.16,1,.3,1);}
.product-card:hover .product-icon img{transform:scale(1.08);}
.product-divider{width:36px;height:1px;background:var(--rich-gold);margin-bottom:min(1rem, 2vh);}
.product-name{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--charcoal);text-align:center;}



/* RESPONSIVE */


@media (max-width:600px){

  .search-row{align-items:flex-start;}
  .search-controls{width:100%;}
  .search-box,.search-box input{width:100%;}
}
@media (max-width:480px){
  .hero{padding:1.5rem 1.25rem;justify-content:flex-end;flex-direction:column;}
  .hero p{max-width:100%;}
  .shop-wrap{padding:2.5rem 1.25rem 3rem;}
  
}
html,body{max-width:100%;overflow-x:hidden;}


</style>
  <link href="components.css" rel="stylesheet">
</head>
<body>

<div id="header-placeholder"></div>




<section class="hero">
  <div class="hero-inner">
    <h1>SHOP</h1>
    <p>Connecting the finest seafood from pristine waters to discerning markets around the world.</p>
  </div>
</section>

<div class="shop-wrap">
  <div class="search-row reveal">
    <h1>SEARCH PRODUCTS</h1>
    <div class="search-controls">
      <div class="search-box">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" placeholder="Search...">
      </div>
      <select class="sort-select">
        <option>Default Sorting</option>
        <option>Price: Low to High</option>
        <option>Price: High to Low</option>
        <option>Name: A–Z</option>
      </select>
    </div>
  </div>

  <div class="shop-grid">


    <div class="product-grid">

      <div class="product-card reveal">
        <div class="product-icon"><img src="images/tiger-prawns.jpg" alt="Carabinaro Shrimp"></div>
        <div class="product-divider"></div>
        <div class="product-name">Carabinaro Shrimp</div>
      </div>

      <div class="product-card reveal">
        <div class="product-icon"><img src="images/pdf_extracted/extracted_3_2208x3936.jpeg" alt="Calluga Hybrid Caviar"></div>
        <div class="product-divider"></div>
        <div class="product-name">Calluga Hybrid Caviar</div>
      </div>

      <div class="product-card reveal">
        <div class="product-icon"><img src="images/sturgeon-caviar.jpg" alt="Osetra Caviar"></div>
        <div class="product-divider"></div>
        <div class="product-name">Osetra Caviar</div>
      </div>

      <div class="product-card reveal">
        <div class="product-icon"><img src="images/hero-seafood.jpg" alt="Belluga Caviar"></div>
        <div class="product-divider"></div>
        <div class="product-name">Belluga Caviar</div>
      </div>

      <div class="product-card reveal">
        <div class="product-icon"><img src="images/pdf_extracted/extracted_6_2000x1488.jpeg" alt="Frozen Yellow Tail Hamachi"></div>
        <div class="product-divider"></div>
        <div class="product-name">Frozen Yellow Tail Hamachi</div>
      </div>

      <div class="product-card reveal">
        <div class="product-icon"><img src="images/pdf_extracted/extracted_4_2000x1499.jpeg" alt="King Crab Legs"></div>
        <div class="product-divider"></div>
        <div class="product-name">King Crab Legs</div>
      </div>

      <div class="product-card reveal">
        <div class="product-icon"><img src="images/pdf_extracted/extracted_1_2000x2500.jpeg" alt="Lobster Tail"></div>
        <div class="product-divider"></div>
        <div class="product-name">Lobster Tail</div>
      </div>

      <div class="product-card reveal">
        <div class="product-icon"><img src="images/salmon-fillet.jpg" alt="Premium Saku Tuna"></div>
        <div class="product-divider"></div>
        <div class="product-name">Premium Saku Tuna</div>
      </div>

      <div class="product-card reveal">
        <div class="product-icon"><img src="images/pdf_extracted/extracted_5_2000x1331.jpeg" alt="Premium Tuna Loin"></div>
        <div class="product-divider"></div>
        <div class="product-name">Premium Tuna Loin</div>
      </div>

    </div>
  </div>
</div>

<div id="footer-placeholder"></div>



<script src="components.js"></script>
</body>
</html>
